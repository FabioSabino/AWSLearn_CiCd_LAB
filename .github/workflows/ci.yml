name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102186470770:role/Sabino-GitHubActions-ECR-AWSLearn-CICD-LAB
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        run: |
           docker build -t sabino-awslearn-cicd-lab .

      - name: Tag Docker image
        run: |
           docker tag sabino-awslearn-cicd-lab:latest 102186470770.dkr.ecr.us-east-1.amazonaws.com/sabino-awslearn-cicd-lab:latest

      - name: Push Docker image to ECR
        run: |
           docker push 102186470770.dkr.ecr.us-east-1.amazonaws.com/sabino-awslearn-cicd-lab:latest
